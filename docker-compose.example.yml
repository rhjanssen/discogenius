services:
  discogenius:
    # Pin release tags on NAS/custom-app platforms when possible.
    # Some hosts cache `latest` unless you force a pull before redeploying.
    image: rhjanssen/discogenius:latest
    container_name: discogenius
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - NODE_ENV=production
      - DOCKER=true
      - PORT=${PORT:-3737}
      - TZ=Etc/UTC
      - DISCOGENIUS_DISABLE_MONITORING=${DISCOGENIUS_DISABLE_MONITORING:-1}
      - DISCOGENIUS_DISABLE_SCHEDULER=${DISCOGENIUS_DISABLE_SCHEDULER:-0}
    ports:
      # Defaults to 3737. Change PORT in .env to publish Discogenius on a different port.
      - "${PORT:-3737}:${PORT:-3737}"
    volumes:
      # Persistent config directory (database, settings, tidal tokens)
      - ./config:/config
      # Transient download/import workspace (optional but recommended)
      - ./downloads:/downloads
      # Library directory
      # You can map these individually to different NAS shares if needed
      - ./library:/library
      # - /path/to/nas/stereo:/library/stereo-music
      # - /path/to/nas/spatial:/library/spatial-music
      # - /path/to/nas/videos:/library/music-videos
    restart: unless-stopped

  # Optional Apple Music decryption wrapper. Enable only when testing Apple
  # Music downloads:
  #   docker compose --profile apple-music up -d apple-music-wrapper
  # First-time wrapper login still needs to be performed with the wrapper image
  # and your Apple Music account so ./config/providers/apple-music/wrapper-rootfs
  # contains an authenticated rootfs.
  apple-music-wrapper:
    image: ghcr.io/itouakirai/wrapper:x86
    profiles: ["apple-music"]
    # Shares the discogenius network namespace. If the discogenius container is
    # RECREATED (not just restarted), recreate this one too — otherwise it stays
    # attached to the dead namespace and ports 10020/20020 become unreachable:
    #   docker compose up -d --force-recreate apple-music-wrapper
    network_mode: "service:discogenius"
    entrypoint: ["/bin/bash", "/app/wrapper-entrypoint.sh"]
    # Discogenius provisions the mounted entrypoint script at boot, so start
    # after it (and restart until the file exists on very first boot).
    depends_on:
      - discogenius
    volumes:
      - ./config/providers/apple-music/wrapper-rootfs/data:/app/rootfs/data
      - ./config/providers/apple-music/wrapper-entrypoint.sh:/app/wrapper-entrypoint.sh
    restart: unless-stopped
