services:
  discogenius:
    # Pin release tags on NAS/custom-app platforms when possible.
    # Some hosts cache `latest` unless you force a pull before redeploying.
    image: rhjanssen/discogenius:latest
    container_name: discogenius
    # Optional overrides file. Everything below has a built-in default, so a
    # fresh clone runs without a .env; copy .env.example to .env only to override.
    env_file:
      - path: .env
        required: false
    environment:
      - PUID=1000
      - PGID=1000
      - NODE_ENV=production
      - DOCKER=true
      - PORT=${PORT:-3737}
      - TZ=Etc/UTC
      - DISCOGENIUS_DISABLE_MONITORING=${DISCOGENIUS_DISABLE_MONITORING:-1}
      - DISCOGENIUS_DISABLE_SCHEDULER=${DISCOGENIUS_DISABLE_SCHEDULER:-0}
      # Catalog source factory default is online Servarr Metadata. Do not set
      # DISCOGENIUS_CATALOG_SOURCE here — when set it overrides Settings and a
      # wiped config/DB. See .env.example / docs/MB_LOCAL_MODE.md for local-MB.
    ports:
      # Defaults to 3737. Change PORT in .env to publish Discogenius on a different port.
      - "${PORT:-3737}:${PORT:-3737}"
    volumes:
      # Persistent config directory (database, settings, provider tokens)
      - ./config:/config
      # Transient download/import workspace (optional but recommended)
      - ./downloads:/downloads
      # Library directory
      # You can map these individually to different NAS shares if needed
      - ./library:/library
      # - /path/to/nas/stereo:/library/stereo-music
      # - /path/to/nas/spatial:/library/spatial-music
      # - /path/to/nas/videos:/library/music-videos
    restart: unless-stopped

  # Apple Music decryption wrapper (FairPlay). Only needed for Apple Music
  # downloads — catalog/auth still work without it. Delete this whole service
  # block if you will not use Apple Music downloads.
  #
  # Own network, not shared with discogenius. The supervisor binds 0.0.0.0 on
  # 10020/20020 and Discogenius reaches it as apple-music-wrapper:10020. A
  # shared netns used to kill the wrapper login whenever discogenius was
  # recreated. Recreating the API container no longer recreates this sidecar;
  # recreate it only when the wrapper session itself is dead:
  #   docker compose up -d --force-recreate apple-music-wrapper
  #
  # First-time Apple ID/2FA login is done from the Auth page; Discogenius
  # provisions the supervisor script at boot into the shared data volume
  # (config/providers/apple-music/wrapper-rootfs/data/wrapper-entrypoint.sh).
  #
  # The entrypoint is a static bootstrap that waits for that script to appear,
  # then execs it. Do NOT bind-mount the script as a file: if the host file
  # does not exist yet when this container starts (it is written by Discogenius,
  # and depends_on only waits for Discogenius to start), Docker creates an empty
  # directory in its place and the sidecar breaks until you recreate it. Mounting
  # only the data *directory* and waiting for the script self-heals a fresh deploy.
  apple-music-wrapper:
    image: ghcr.io/itouakirai/wrapper:x86
    expose:
      - "10020"
      - "20020"
    entrypoint:
      - /bin/bash
      - -c
      - 'while [ ! -s /app/rootfs/data/wrapper-entrypoint.sh ]; do echo "[wrapper-boot] waiting for Discogenius to provision the supervisor script..."; sleep 2; done; exec /bin/bash /app/rootfs/data/wrapper-entrypoint.sh'
    depends_on:
      discogenius:
        condition: service_healthy
    volumes:
      - ./config/providers/apple-music/wrapper-rootfs/data:/app/rootfs/data
    restart: unless-stopped
