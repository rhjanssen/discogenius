services:
  discogenius:
    build:
      context: .
      # Always rebuild to ensure latest code
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: discogenius:latest
    container_name: discogenius
    # Optional overrides file. Everything below has a built-in default, so a
    # fresh clone runs without a .env; copy .env.example to .env only to override.
    env_file:
      - path: .env
        required: false
    environment:
      - PUID=568
      - PGID=568
      - NODE_ENV=production
      - DOCKER=true
      - PORT=${PORT:-3737}
      - DISCOGENIUS_BIND_IP=0.0.0.0
      - TZ=Etc/UTC
      - DISCOGENIUS_DISABLE_MONITORING=${DISCOGENIUS_DISABLE_MONITORING:-0}
      - DISCOGENIUS_DISABLE_SCHEDULER=${DISCOGENIUS_DISABLE_SCHEDULER:-0}
      - DISCOGENIUS_DISABLE_DOWNLOADS=${DISCOGENIUS_DISABLE_DOWNLOADS:-0}
      - DISCOGENIUS_WRITE_PROFILE_MS=${DISCOGENIUS_WRITE_PROFILE_MS:-0}
      # Catalog source factory default is online Servarr Metadata (see config.ts).
      # Do not set DISCOGENIUS_CATALOG_SOURCE here — when set (via .env or environment)
      # it overrides Settings and survives a wiped config/DB. Use musicbrainz-local
      # only when intentionally forcing local MusicBrainz (docs/MB_LOCAL_MODE.md).
      # Log any main-thread DB read that blocks the event loop longer than this
      # many ms (0 = off). Set e.g. DISCOGENIUS_READ_PROFILE_MS=50 to find the
      # queries that make the UI sluggish under heavy refresh/import load.
      - DISCOGENIUS_READ_PROFILE_MS=${DISCOGENIUS_READ_PROFILE_MS:-0}
      # Log a per-phase breakdown of any curation pass slower than this many ms
      # (0 = off). Curation is the last mostly-synchronous stretch of a command,
      # so when a command dies without a stack this says which phase held it.
      - DISCOGENIUS_CURATION_PROFILE_MS=${DISCOGENIUS_CURATION_PROFILE_MS:-0}
      # Keep the SQLite file off the host bind mount. On Docker Desktop the
      # /config mount is a Windows/macOS filesystem reached over gRPC-FUSE or
      # virtiofs, which does not give SQLite the locking and write-ordering it
      # needs; a long import against it produced B-tree corruption ("2nd
      # reference to page N") on 2026-08-05. The `db` volume below is ordinary
      # ext4 inside the VM. Settings, provider tokens and Backups stay under
      # /config where you can read them from the host.
      - DB_PATH=${DB_PATH:-/data/discogenius.db}
    ports:
      # Defaults to 3737. Change PORT in .env to publish Discogenius on a different port.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3737}:${PORT:-3737}"
    volumes:
      # Persistent config directory (settings, provider tokens, backups)
      - ./config:/config
      # The SQLite database — a named volume, never a host bind mount. See
      # DB_PATH above for why. `docker compose down -v` deletes it; the
      # database is rebuildable from the catalog and providers, everything you
      # would miss lives in ./config and ./library.
      - db:/data
      # Temporary download/import workspace
      - ./downloads:/downloads
      # Library directory (organized music)
      # You can map these individually to different NAS shares if needed
      - ./library:/library
      # - /path/to/nas/stereo:/library/stereo-music
      # - /path/to/nas/spatial:/library/spatial-music
      # - /path/to/nas/videos:/library/music-videos
    restart: unless-stopped

  # Apple Music decryption wrapper (FairPlay). Only needed for Apple Music
  # downloads — catalog/auth still work without it. Delete this whole service
  # block if you will not use Apple Music downloads.
  #
  # Own network, not shared with discogenius. The supervisor binds 0.0.0.0 on
  # 10020/20020 and Discogenius reaches it as apple-music-wrapper:10020. A
  # shared netns used to kill the wrapper login whenever discogenius was
  # recreated. Recreating the API container no longer recreates this sidecar.
  # If it is stopped, start it without replacing its saved session:
  #   docker compose up -d apple-music-wrapper
  # Re-authenticate from the Auth page only when the running wrapper reports a
  # persistent session error.
  #
  # First-time Apple ID/2FA login is done from the Auth page; Discogenius
  # provisions the supervisor script at boot into the shared data volume
  # (config/providers/apple-music/wrapper-rootfs/data/wrapper-entrypoint.sh).
  #
  # The entrypoint is a static bootstrap that waits for that script to appear,
  # then execs it. Do NOT bind-mount the script as a file: if the host file
  # does not exist yet when this container starts (it is written by Discogenius,
  # and depends_on only waits for Discogenius to start), Docker creates an empty
  # directory in its place and the sidecar breaks until you recreate it. Mounting
  # only the data *directory* and waiting for the script self-heals a fresh deploy.
  apple-music-wrapper:
    image: ghcr.io/itouakirai/wrapper:x86
    expose:
      - "10020"
      - "20020"
    entrypoint:
      - /bin/bash
      - -c
      - 'while [ ! -s /app/rootfs/data/wrapper-entrypoint.sh ]; do echo "[wrapper-boot] waiting for Discogenius to provision the supervisor script..."; sleep 2; done; exec /bin/bash /app/rootfs/data/wrapper-entrypoint.sh'
    depends_on:
      discogenius:
        # Wait until Discogenius is healthy so the supervisor script is already
        # on the shared volume. Do not restart:true — that would kill a live
        # wrapper session every time the API container is recreated.
        condition: service_healthy
    volumes:
      - ./config/providers/apple-music/wrapper-rootfs/data:/app/rootfs/data
    restart: unless-stopped

volumes:
  # SQLite lives here rather than on ./config so it sits on ext4 inside the
  # Docker VM. See the DB_PATH comment on the discogenius service.
  db:
