services:
  discogenius:
    build:
      context: .
      # Always rebuild to ensure latest code
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: discogenius:latest
    container_name: discogenius
    env_file:
      - .env
    environment:
      - PUID=568
      - PGID=568
      - NODE_ENV=production
      - DOCKER=true
      - PORT=${PORT:-3737}
      - TZ=Etc/UTC
      - DISCOGENIUS_DISABLE_MONITORING=${DISCOGENIUS_DISABLE_MONITORING:-0}
      - DISCOGENIUS_DISABLE_SCHEDULER=${DISCOGENIUS_DISABLE_SCHEDULER:-0}
      - DISCOGENIUS_DISABLE_DOWNLOADS=${DISCOGENIUS_DISABLE_DOWNLOADS:-0}
      - DISCOGENIUS_WRITE_PROFILE_MS=${DISCOGENIUS_WRITE_PROFILE_MS:-0}
    ports:
      # Defaults to 3737. Change PORT in .env to publish Discogenius on a different port.
      - "${PORT:-3737}:${PORT:-3737}"
    volumes:
      # Persistent config directory (database, settings, tidal tokens)
      - ./config:/config
      # Temporary download/import workspace
      - ./downloads:/downloads
      # Library directory (organized music)
      # You can map these individually to different NAS shares if needed
      - ./library:/library
      # - /path/to/nas/stereo:/library/stereo-music
      # - /path/to/nas/spatial:/library/spatial-music
      # - /path/to/nas/videos:/library/music-videos
    restart: unless-stopped

  # Optional Apple Music decryption wrapper. Enable only when testing Apple
  # Music downloads:
  #   docker compose --profile apple-music up -d apple-music-wrapper
  # First-time wrapper login still needs to be performed with the wrapper image
  # and your Apple Music account so ./config/providers/apple-music/wrapper-rootfs
  # contains an authenticated rootfs.
  apple-music-wrapper:
    image: ghcr.io/itouakirai/wrapper:x86
    profiles: ["apple-music"]
    network_mode: "service:discogenius"
    environment:
      - args=-M 20020 -H 0.0.0.0
    volumes:
      - ./config/providers/apple-music/wrapper-rootfs/data:/app/rootfs/data
    restart: unless-stopped
