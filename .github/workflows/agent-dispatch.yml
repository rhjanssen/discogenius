name: Multi-Agent Dispatch (Gemini, Claude, Cursor)

on:
  issues:
    types: [labeled, assigned]
  pull_request:
    types: [labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      agent:
        description: "Target agent (auto prefers Claude/Gemini and reserves Cursor for Grok Bot)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - gemini
          - claude
          - cursor
      issue_number:
        description: "GitHub Issue or PR number"
        required: true
        type: string
      prompt:
        description: "Optional extra instructions"
        required: false
        type: string

# Concurrency lives on the agent jobs, not the workflow (#92). Creating an issue with
# several labels fires one `labeled` run per label; a workflow-level group let the
# runs for `ready`/`P1`/... cancel the pending `agent:auto` run. Non-agent label
# events now skip `route` (job-level `if:`) and never join the per-issue group.

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  route:
    name: Route & Check Agent Quota
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'pull_request') &&
        (
          github.event.action == 'assigned' ||
          startsWith(github.event.label.name, 'agent:') ||
          contains(fromJSON('["gemini","claude","cursor"]'), github.event.label.name)
        )
      ) ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (
          contains(github.event.comment.body, '@gemini') ||
          contains(github.event.comment.body, '@claude') ||
          contains(github.event.comment.body, '@cursor') ||
          contains(github.event.comment.body, '@agent-auto')
        ) &&
        !contains(github.event.comment.body, '<!-- agent-loop-guard -->')
      )
    outputs:
      target_agent: ${{ steps.decide.outputs.target_agent }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
      extra_prompt: ${{ steps.decide.outputs.extra_prompt }}
    steps:
      - name: Determine target agent & check cloud quota state
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          ISSUE_NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          QUOTA_VAR: ${{ vars.AGENT_QUOTA_STATUS }}
          HAS_GEMINI_AUTH: ${{ secrets.GEMINI_OAUTH_CREDS_JSON != '' || secrets.GEMINI_API_KEY != '' }}
          HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          NUM="${ISSUE_NUM:-$INPUT_ISSUE}"
          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"

          REQUESTED=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REQUESTED="$INPUT_AGENT"
          elif [ "$EVENT_NAME" = "issues" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            # Decide from the issue's current labels (#92): the triggering label wins
            # while it is still present; otherwise use whatever agent label is on it now.
            CURRENT=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json labels -q '.labels[].name' 2>/dev/null || echo "$LABEL_NAME")
            if [ -n "$LABEL_NAME" ] && echo "$CURRENT" | grep -qxF "$LABEL_NAME"; then
              CURRENT="$LABEL_NAME"
            fi
            if echo "$CURRENT" | grep -qxE 'agent:gemini|gemini'; then REQUESTED="gemini";
            elif echo "$CURRENT" | grep -qxE 'agent:claude|claude'; then REQUESTED="claude";
            elif echo "$CURRENT" | grep -qxE 'agent:cursor|cursor'; then REQUESTED="cursor";
            elif echo "$CURRENT" | grep -qxE 'agent:auto'; then REQUESTED="auto";
            elif [ "${{ github.event.action }}" = "assigned" ] && echo "$CURRENT" | grep -qx 'ready'; then REQUESTED="auto";
            fi
          else
            if echo "$COMMENT_BODY" | grep -qiE '@gemini'; then REQUESTED="gemini";
            elif echo "$COMMENT_BODY" | grep -qiE '@claude'; then REQUESTED="claude";
            elif echo "$COMMENT_BODY" | grep -qiE '@cursor'; then REQUESTED="cursor";
            elif echo "$COMMENT_BODY" | grep -qiE '@agent-auto'; then REQUESTED="auto";
            fi
          fi

          # Resolve 'auto': prefer Claude & Gemini first; reserve Cursor (shared with Grok Bot) as last resort
          if [ "$REQUESTED" = "auto" ]; then
            LABELS=""
            if [ -n "$NUM" ]; then
              LABELS=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json labels -q '.labels[].name' || true)
            fi
            NOW_EPOCH=$(date +%s)
            CLAUDE_COOL_UNTIL=$(echo "${QUOTA_VAR:-{}}" | jq -r '.claudeCooldownUntil // 0' 2>/dev/null || echo 0)
            GEMINI_COOL_UNTIL=$(echo "${QUOTA_VAR:-{}}" | jq -r '.geminiCooldownUntil // 0' 2>/dev/null || echo 0)

            CLAUDE_EXHAUSTED=0
            GEMINI_EXHAUSTED=0
            echo "$LABELS" | grep -qx 'quota-exhausted:claude' && CLAUDE_EXHAUSTED=1 || true
            echo "$LABELS" | grep -qx 'quota-exhausted:gemini' && GEMINI_EXHAUSTED=1 || true
            [ "$CLAUDE_COOL_UNTIL" -gt "$NOW_EPOCH" ] 2>/dev/null && CLAUDE_EXHAUSTED=1 || true
            [ "$GEMINI_COOL_UNTIL" -gt "$NOW_EPOCH" ] 2>/dev/null && GEMINI_EXHAUSTED=1 || true

            if [ "$GEMINI_EXHAUSTED" -eq 0 ] && [ "$HAS_GEMINI_AUTH" = "true" ]; then
              REQUESTED="gemini"
            elif [ "$CLAUDE_EXHAUSTED" -eq 0 ] && [ "$HAS_CLAUDE_AUTH" = "true" ]; then
              REQUESTED="claude"
            elif [ "$GEMINI_EXHAUSTED" -eq 0 ]; then
              REQUESTED="gemini"
            elif [ "$CLAUDE_EXHAUSTED" -eq 0 ]; then
              REQUESTED="claude"
            else
              REQUESTED="cursor"
            fi
          fi

          echo "target_agent=$REQUESTED" >> "$GITHUB_OUTPUT"
          PROMPT_VAL="${INPUT_PROMPT:-$COMMENT_BODY}"
          EOF_MARK="EOF_$(date +%s)"
          {
            echo "extra_prompt<<$EOF_MARK"
            echo "$PROMPT_VAL"
            echo "$EOF_MARK"
          } >> "$GITHUB_OUTPUT"

  gemini-agent:
    name: Gemini / Antigravity Agent (Subscription OAuth + Cached Full VM)
    needs: route
    if: needs.route.outputs.target_agent == 'gemini'
    concurrency:
      group: agent-run-${{ needs.route.outputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_OAUTH_CREDS_JSON: ${{ secrets.GEMINI_OAUTH_CREDS_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
      EXTRA_PROMPT: ${{ needs.route.outputs.extra_prompt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack & Setup Node.js 22 (with Yarn cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Cache .ref_* reference repositories
        uses: actions/cache@v4
        with:
          path: .ref_*
          key: discogenius-refs-v1-${{ hashFiles('scripts/agent-env/install.sh') }}
          restore-keys: |
            discogenius-refs-v1-

      - name: Bootstrap environment (scripts/agent-env/install.sh)
        run: bash scripts/agent-env/install.sh

      - name: Configure Antigravity CLI Subscription OAuth (~/.gemini/jetski-standalone-oauth-token)
        run: |
          mkdir -p ~/.gemini/antigravity-cli
          if [ -n "$GEMINI_OAUTH_CREDS_JSON" ]; then
            printf '%s\n' "$GEMINI_OAUTH_CREDS_JSON" > ~/.gemini/jetski-standalone-oauth-token
            printf '%s\n' "$GEMINI_OAUTH_CREDS_JSON" > ~/.gemini/antigravity-cli/antigravity-oauth-token
            printf '%s\n' "$GEMINI_OAUTH_CREDS_JSON" > ~/.gemini/antigravity-oauth-token
            chmod 600 ~/.gemini/jetski-standalone-oauth-token ~/.gemini/antigravity-cli/antigravity-oauth-token ~/.gemini/antigravity-oauth-token
          fi
          cat << 'EOF' > ~/.gemini/antigravity-cli/jetski_state.pbtxt
          post_onboarding: {
            completed_steps: POST_ONBOARDING_STEP_TYPE_MANAGER_WELCOME
            completed_steps: POST_ONBOARDING_STEP_TYPE_USAGE_MODE
            completed_steps: POST_ONBOARDING_STEP_TYPE_AGENT_CONFIGURATION
            completed_steps: POST_ONBOARDING_STEP_TYPE_ADD_WORKSPACE
          }
          installation_uuid: "3cc90750-e88d-41e7-bbc2-60770ca24809"
          migrations: { key: 3 value: MIGRATION_STATUS_COMPLETED }
          migrations: { key: 4 value: MIGRATION_STATUS_COMPLETED }
          migrations: { key: 5 value: MIGRATION_STATUS_COMPLETED }
          EOF

      - name: Prepare or resume issue branch (agent/issue-N)
        run: |
          git config user.name "gemini[bot]"
          git config user.email "gemini[bot]@users.noreply.github.com"
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Resuming existing branch $BRANCH from previous agent session..."
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Install & Run Antigravity CLI (agy) on Issue/PR
        id: run_gemini
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dbus-x11 gnome-keyring libsecret-tools
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json title,body,url)
          TITLE=$(echo "$ISSUE_JSON" | jq -r .title)
          BODY=$(echo "$ISSUE_JSON" | jq -r .body)
          URL=$(echo "$ISSUE_JSON" | jq -r .url)

          PROMPT="Read AGENTS.md and HANDOFF.md first. You are working on GitHub Issue #${ISSUE_NUMBER}: ${TITLE} (${URL}).
          If HANDOFF.md or existing commits on branch agent/issue-${ISSUE_NUMBER} show prior work from another agent, continue right where it left off.
          Implement the requested changes, run 'yarn ci' to verify, update HANDOFF.md with your status, commit and push branch agent/issue-${ISSUE_NUMBER}, and open or update a Pull Request using 'gh pr create' or 'gh pr edit'.

          Issue body:
          ${BODY}

          Additional context:
          ${EXTRA_PROMPT}"

          set +e
          dbus-run-session -- bash -c '
            eval $(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)
            if [ -n "$GEMINI_OAUTH_CREDS_JSON" ]; then
              printf "%s" "$GEMINI_OAUTH_CREDS_JSON" | secret-tool store --label="gemini:antigravity" service gemini username antigravity
              printf "%s" "$GEMINI_OAUTH_CREDS_JSON" | secret-tool store --label="gemini:antigravity" service "gemini:antigravity" username antigravity
            fi
            # Model fallback chain: each model has its own quota bucket on the Antigravity subscription.
            # Override order with repo variable GEMINI_MODELS (space-separated).
            MODELS="${GEMINI_MODELS:-gemini-4-argon-high gemini-3.8-flash-high claude-sonnet-5-5-high}"
            for MODEL in $MODELS; do
              echo "[agy] trying model $MODEL"
              agy --model "$MODEL" --log-file /tmp/agy-debug.log -p "$1" --dangerously-skip-permissions 2>&1 | tee -a /tmp/agy-run.log
              RC=${PIPESTATUS[0]}
              if ! tail -n 40 /tmp/agy-run.log | grep -qiE "RESOURCE_EXHAUSTED|quota reached"; then exit $RC; fi
              echo "[agy] $MODEL quota exhausted, falling back"
            done
            exit 1
          ' _ "$PROMPT" 2>&1 | tee /tmp/gemini-agent.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ] && [ -f /tmp/agy-debug.log ]; then
            echo "=== /tmp/agy-debug.log (tail) ==="
            tail -n 60 /tmp/agy-debug.log || true
          fi
          set -e

          if [ "$EXIT_CODE" -ne 0 ] && tail -n 60 /tmp/gemini-agent.log | grep -qiE 'RESOURCE_EXHAUSTED|quota reached|quota exceeded|out of usage'; then
            echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "quota_exhausted=false" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Save WIP & Auto-Failover if Gemini ran out of usage
        if: steps.run_gemini.outputs.quota_exhausted == 'true'
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "wip(issue-${ISSUE_NUMBER}): save Gemini progress before quota failover" || true
          fi
          git push -u origin "$BRANCH" || true

          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name' || true)
          if echo "$LABELS" | grep -qx 'quota-exhausted:claude'; then
            NEXT_LABEL="agent:cursor"
            NEXT_MENTION="@cursor"
          else
            NEXT_LABEL="agent:claude"
            NEXT_MENTION="@claude"
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --add-label "quota-exhausted:gemini,${NEXT_LABEL}" \
            --remove-label "agent:gemini" || true

          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "⚠️ **Gemini / Antigravity reached its subscription usage limit.** Work-in-progress has been saved to branch \`${BRANCH}\`. Automatically handing over to ${NEXT_MENTION} (\`${NEXT_LABEL}\`) to pick up where Gemini left off."

          # Events created with GITHUB_TOKEN never trigger workflows, so start the next agent explicitly.
          gh workflow run agent-dispatch.yml --repo "${{ github.repository }}" \
            -f agent="${NEXT_LABEL#agent:}" -f issue_number="$ISSUE_NUMBER" \
            -f prompt="Continue from branch ${BRANCH} (WIP saved by Gemini after quota exhaustion). Follow AGENTS.md and HANDOFF.md." || true

      # The agent step uses continue-on-error so the quota failover above can run;
      # without this step an auth error (e.g. expired OAuth token) or a rejected push
      # still concluded the job as "success".
      - name: Push agent commits & fail visibly on agent error
        if: ${{ !cancelled() && steps.run_gemini.outcome != 'skipped' && steps.run_gemini.outputs.quota_exhausted != 'true' }}
        env:
          AGENT_OUTCOME: ${{ steps.run_gemini.outcome }}
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          REASON=""
          if [ "$AGENT_OUTCOME" != "success" ]; then
            REASON="Gemini did not complete (step outcome: $AGENT_OUTCOME); see the run log, an expired auth token is a common cause."
          elif [ "$(git rev-list --count "origin/${{ github.event.repository.default_branch }}..HEAD" 2>/dev/null || echo 0)" -gt 0 ] \
            && ! git push -u origin "HEAD:refs/heads/$BRANCH" > /tmp/push.log 2>&1; then
            cat /tmp/push.log
            REASON="pushing \`$BRANCH\` failed: $(grep -m1 -E 'rejected|error' /tmp/push.log || tail -n1 /tmp/push.log). Commits that touch .github/workflows/ need a token with workflow scope; push those manually."
          fi
          if [ -n "$REASON" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --body "<!-- agent-loop-guard -->❌ **Gemini agent run failed:** $REASON ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            echo "::error::$REASON"
            exit 1
          fi

  claude-agent:
    name: Claude Code Agent (Subscription OAuth + Cached Full VM)
    needs: route
    if: needs.route.outputs.target_agent == 'claude'
    concurrency:
      group: agent-run-${{ needs.route.outputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
      ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
      EXTRA_PROMPT: ${{ needs.route.outputs.extra_prompt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack & Setup Node.js 22 (with Yarn cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Cache .ref_* reference repositories
        uses: actions/cache@v4
        with:
          path: .ref_*
          key: discogenius-refs-v1-${{ hashFiles('scripts/agent-env/install.sh') }}
          restore-keys: |
            discogenius-refs-v1-

      - name: Bootstrap environment (scripts/agent-env/install.sh)
        run: bash scripts/agent-env/install.sh

      - name: Configure Claude Subscription OAuth (~/.claude/.credentials.json)
        run: |
          if [ -n "$CLAUDE_CREDENTIALS_JSON" ]; then
            mkdir -p ~/.claude
            printf '%s\n' "$CLAUDE_CREDENTIALS_JSON" > ~/.claude/.credentials.json
            chmod 600 ~/.claude/.credentials.json
          fi

      - name: Prepare or resume issue branch (agent/issue-N)
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Resuming existing branch $BRANCH from previous agent session..."
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run Claude Code CLI on Issue/PR
        id: run_claude
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json title,body,url)
          TITLE=$(echo "$ISSUE_JSON" | jq -r .title)
          BODY=$(echo "$ISSUE_JSON" | jq -r .body)
          URL=$(echo "$ISSUE_JSON" | jq -r .url)

          PROMPT="Read AGENTS.md and HANDOFF.md first. You are working on GitHub Issue #${ISSUE_NUMBER}: ${TITLE} (${URL}).
          If HANDOFF.md or existing commits on branch agent/issue-${ISSUE_NUMBER} show prior work from another agent, continue right where it left off.
          Implement the requested changes, run 'yarn ci' to verify, update HANDOFF.md with your status, commit and push branch agent/issue-${ISSUE_NUMBER}, and open or update a Pull Request using 'gh pr create' or 'gh pr edit'.

          Issue body:
          ${BODY}

          Additional context:
          ${EXTRA_PROMPT}"

          set +e
          claude -p "$PROMPT" --dangerously-skip-permissions 2>&1 | tee /tmp/claude-agent.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if grep -qiE '5-hour limit|usage limit|rate.?limit|quota exceeded|429|out of usage' /tmp/claude-agent.log; then
            echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "quota_exhausted=false" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Save WIP & Auto-Failover if Claude ran out of usage
        if: steps.run_claude.outputs.quota_exhausted == 'true'
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "wip(issue-${ISSUE_NUMBER}): save Claude progress before quota failover" || true
          fi
          git push -u origin "$BRANCH" || true

          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name' || true)
          if echo "$LABELS" | grep -qx 'quota-exhausted:gemini'; then
            NEXT_LABEL="agent:cursor"
            NEXT_MENTION="@cursor"
          else
            NEXT_LABEL="agent:gemini"
            NEXT_MENTION="@gemini"
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --add-label "quota-exhausted:claude,${NEXT_LABEL}" \
            --remove-label "agent:claude" || true

          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "⚠️ **Claude reached its subscription usage limit.** Work-in-progress has been saved to branch \`${BRANCH}\`. Automatically handing over to ${NEXT_MENTION} (\`${NEXT_LABEL}\`) to pick up where Claude left off."

          # Events created with GITHUB_TOKEN never trigger workflows, so start the next agent explicitly.
          gh workflow run agent-dispatch.yml --repo "${{ github.repository }}" \
            -f agent="${NEXT_LABEL#agent:}" -f issue_number="$ISSUE_NUMBER" \
            -f prompt="Continue from branch ${BRANCH} (WIP saved by Claude after quota exhaustion). Follow AGENTS.md and HANDOFF.md." || true

      # The agent step uses continue-on-error so the quota failover above can run;
      # without this step an auth error (e.g. expired OAuth token) or a rejected push
      # still concluded the job as "success".
      - name: Push agent commits & fail visibly on agent error
        if: ${{ !cancelled() && steps.run_claude.outcome != 'skipped' && steps.run_claude.outputs.quota_exhausted != 'true' }}
        env:
          AGENT_OUTCOME: ${{ steps.run_claude.outcome }}
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          REASON=""
          if [ "$AGENT_OUTCOME" != "success" ]; then
            REASON="Claude did not complete (step outcome: $AGENT_OUTCOME); see the run log, an expired auth token is a common cause."
          elif [ "$(git rev-list --count "origin/${{ github.event.repository.default_branch }}..HEAD" 2>/dev/null || echo 0)" -gt 0 ] \
            && ! git push -u origin "HEAD:refs/heads/$BRANCH" > /tmp/push.log 2>&1; then
            cat /tmp/push.log
            REASON="pushing \`$BRANCH\` failed: $(grep -m1 -E 'rejected|error' /tmp/push.log || tail -n1 /tmp/push.log). Commits that touch .github/workflows/ need a token with workflow scope; push those manually."
          fi
          if [ -n "$REASON" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --body "<!-- agent-loop-guard -->❌ **Claude agent run failed:** $REASON ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            echo "::error::$REASON"
            exit 1
          fi

  cursor-agent:
    name: Cursor Cloud Agent Dispatch (Fallback / Explicit)
    needs: route
    if: needs.route.outputs.target_agent == 'cursor'
    concurrency:
      group: agent-run-${{ needs.route.outputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
      EXTRA_PROMPT: ${{ needs.route.outputs.extra_prompt }}
    steps:
      - name: Trigger Cursor Cloud Agent API
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --body "<!-- agent-loop-guard -->⚠️ \`CURSOR_API_KEY\` secret is not configured in GitHub repository secrets. Please add it or assign \`agent:claude\` / \`agent:gemini\`."
            exit 1
          fi
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json title,body,url)
          TITLE=$(echo "$ISSUE_JSON" | jq -r .title)
          BODY=$(echo "$ISSUE_JSON" | jq -r .body)
          URL=$(echo "$ISSUE_JSON" | jq -r .url)

          PROMPT_TEXT="Read AGENTS.md and HANDOFF.md first. Pick up GitHub Issue #${ISSUE_NUMBER}: ${TITLE} (${URL}). If branch agent/issue-${ISSUE_NUMBER} exists on origin, check it out and continue where the previous agent left off. Verify with yarn ci, update HANDOFF.md, and open/update a PR.

          Issue description:
          ${BODY}

          Additional context:
          ${EXTRA_PROMPT}"

          PAYLOAD=$(jq -n \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg text "$PROMPT_TEXT" \
            '{repository: $repo, prompt: {text: $text}}')

          curl -sf -X POST "https://api.cursor.com/v1/agents" \
            -H "Authorization: Bearer $CURSOR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
